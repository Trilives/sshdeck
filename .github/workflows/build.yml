name: Build

# Windows-only Tauri build.
#
# - On pull requests and manual runs: builds the app as a smoke test and uploads
#   the NSIS installer plus portable ZIP as workflow artifacts.
# - On a stable version tag (v1.2.3): builds and drafts a GitHub Release for the Stable channel.
# - On a pre-release tag (v1.2.3-beta.1): builds a published pre-release and mirrors its `latest.json`
#   onto the rolling `preview` release, which the in-app Preview update channel points at.

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to create a Release when building a tag

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Cache Rust build artifacts.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Test file transfer interactions
        working-directory: frontend
        # The Windows runner includes Edge, matching the WebView2 browser engine.
        run: npm test

      # Builds the frontend (via beforeBuildCommand), compiles the Rust app, and
      # bundles the NSIS installer. On a v* tag it also drafts a Release.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing keys for the auto-updater. Set these repo secrets from the keypair
          # generated with `tauri signer generate`. Without them, updater artifacts
          # (the signed .sig + latest.json) are not produced.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && 'SSHDeck __VERSION__' || '' }}
          releaseBody: "Download the installer or the install-free portable ZIP from the assets below. Installed editions can also update from Settings > Software Update."
          # Stable tags (v1.2.3) are drafted for manual publishing; pre-release tags (v1.2.3-beta.1) are
          # published immediately as a pre-release so the Preview channel's manifest resolves to live assets.
          releaseDraft: ${{ !contains(github.ref_name, '-') }}
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Package portable build
        shell: pwsh
        run: |
          $version = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & ".\scripts\package-portable.ps1" `
            -Executable "src-tauri\target\release\sshdeck.exe" `
            -Version $version `
            -OutputDirectory "src-tauri\target\release"

      - name: Upload portable release asset
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          gh release upload $env:GITHUB_REF_NAME `
            "src-tauri/target/release/SSHDeck_${version}_x64-portable.zip" `
            --clobber

      # Preview channel: mirror the pre-release's signed manifest onto the fixed, rolling `preview` release,
      # which the app's Preview endpoint (releases/download/preview/latest.json) points at. The installer URLs
      # inside latest.json reference this pre-release's (published) assets, so no installer copy is needed.
      - name: Publish preview manifest
        if: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create preview --prerelease --title "Preview channel" \
            --notes "Rolling manifest for the in-app Preview update channel. Do not delete." || true
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir preview-manifest --clobber
          gh release upload preview preview-manifest/latest.json --clobber

      # For PR / manual runs (no tag), keep the installer and portable ZIP as downloadable artifacts.
      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: sshdeck-windows
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/release/SSHDeck_*_x64-portable.zip
          if-no-files-found: warn
          retention-days: 7
